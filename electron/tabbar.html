<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Git Lens 标签条</title>
<style>
  /* 自足样式：深色主题与应用一致（取 public/app.css :root 变量同款配色）。
     本页为 Shell 自有 chrome（file:// 本地加载、无远程资源），不属于契约 §14
     的服务端 CSP 范围；所有动态文案一律经 textContent 写入，无注入面。 */
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #010409;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #bar {
    display: flex;
    align-items: stretch;
    height: 38px;
    border-bottom: 1px solid #30363d;
    /* 契约 §17：标签条兼任标题栏——空白区可拖动窗口，系统双击缩放行为沿用 */
    -webkit-app-region: drag;
  }
  /* 契约 §17：交互元素一律 no-drag（标签项、关闭 ×、新建 +），保证点击可达 */
  .tab, .tab-close, #new-tab { -webkit-app-region: no-drag; }
  /* darwin：左侧红绿灯安全区（hiddenInset 红绿灯组约占 78px，避免遮挡标签） */
  body[data-platform="darwin"] #bar { padding-left: 78px; }
  /* 契约 §17.1.1：darwin 全屏时系统隐藏红绿灯，取消左侧安全区让标签吸附靠左；
     退出全屏恢复 78px。仅覆盖 darwin 分支，非 darwin 的右侧 overlay 留白与全屏无关 */
  body.fullscreen[data-platform="darwin"] #bar { padding-left: 0; }
  /* 非 darwin（含 unknown 回落）：右侧为系统 overlay 窗口控制按钮留位（≥140px，
     契约 §17；win/linux 真机未验收） */
  body:not([data-platform="darwin"]) #bar { padding-right: 140px; }
  #tabs {
    display: flex;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    overflow-y: hidden;
    /* 隐藏横向滚动条：标签多时靠压缩宽度而不是出滚动条 */
    scrollbar-width: none;
    /* #tabs 不设 no-drag：标签未占满的空白区随 #bar 拖动窗口（浏览器惯例）。
       横向滚动只发生在标签溢出时——溢出后可视区几乎全被 .tab（no-drag）覆盖，
       滚轮事件落在 no-drag 元素上不受拖拽区吞事件影响；不溢出时无滚动需求。
       取舍详见交付报告。 */
  }
  #tabs::-webkit-scrollbar { display: none; }
  /* 拖动标签时空白区也接收投放；结束后恢复标题栏的窗口拖动能力。 */
  body.tab-dragging #tabs { -webkit-app-region: no-drag; }
  .tab.dragging { opacity: 0.45; }
  #drop-indicator {
    position: fixed;
    top: 3px;
    width: 2px;
    height: 32px;
    background: #58a6ff;
    pointer-events: none;
    z-index: 1;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    box-sizing: border-box;
    min-width: 120px;
    max-width: 220px;
    flex: 0 1 auto;
    padding: 0 8px 0 12px;
    border-right: 1px solid #30363d;
    color: #8b949e;
    font-size: 12px;
    line-height: 1;
    cursor: default;
  }
  .tab.active {
    background: #161b22;
    color: #f0f6fc;
    /* 激活态顶边高亮，与编辑器类应用的标签语义一致 */
    box-shadow: inset 0 2px 0 #58a6ff;
  }
  .tab-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tab-close {
    flex: none;
    width: 18px;
    height: 18px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: inherit;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }
  .tab-close:hover { background: #30363d; color: #f0f6fc; }
  #new-tab {
    flex: none;
    width: 34px;
    border: none;
    border-left: 1px solid #30363d;
    background: transparent;
    color: #8b949e;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  #new-tab:hover { background: #161b22; color: #f0f6fc; }
</style>
</head>
<body>
<div id="bar" role="tablist" aria-label="标签页">
  <div id="tabs"></div>
  <button id="new-tab" type="button" title="新建标签页 (⌘T)" aria-label="新建标签页">+</button>
</div>
<div id="drop-indicator" hidden></div>
<script>
  'use strict';
  // 契约 §17：主进程经 loadFile query 注入平台标识，置到 body[data-platform]
  // 驱动 CSS 分支（darwin 左侧红绿灯安全区 / 其余平台右侧 overlay 控件区）。
  // 白名单外的取值一律按 unknown 处理，样式回落非 darwin 分支（保守预留右留白）
  var KNOWN_PLATFORMS = ['darwin', 'win32', 'linux'];
  var platform = 'unknown';
  try {
    var requested = new URLSearchParams(location.search).get('platform');
    if (KNOWN_PLATFORMS.indexOf(requested) !== -1) platform = requested;
  } catch (err) {
    // query 解析失败按 unknown 处理
  }
  document.body.dataset.platform = platform;

  var tabsEl = document.getElementById('tabs');
  var newTabEl = document.getElementById('new-tab');
  var dropIndicator = document.getElementById('drop-indicator');
  var dragId = null;
  var dragX = null;
  var scrollFrame = null;
  var pendingState = null;
  var pressedClose = false;

  // 标题与激活态可能在拖动途中更新，延后渲染以免移除拖动源而中断手势。
  function render(state) {
    if (dragId !== null) {
      pendingState = state;
      return;
    }
    tabsEl.textContent = '';
    for (var tab of state.tabs) {
      var item = document.createElement('div');
      item.className = 'tab' + (tab.active ? ' active' : '');
      item.setAttribute('role', 'tab');
      item.setAttribute('aria-selected', tab.active ? 'true' : 'false');
      item.dataset.tabId = String(tab.id);
      item.draggable = true;

      var title = document.createElement('span');
      title.className = 'tab-title';
      title.textContent = tab.title;
      title.title = tab.title;
      item.appendChild(title);

      var close = document.createElement('button');
      close.type = 'button';
      close.className = 'tab-close';
      close.textContent = '×';
      close.setAttribute('aria-label', '关闭标签页 ' + tab.title);
      close.addEventListener('click', function (event) {
        // 阻止冒泡：点击 × 只关标签，不触发整条标签的切换
        event.stopPropagation();
        var id = Number(event.currentTarget.parentElement.dataset.tabId);
        window.gitLensTabbar.closeTab(id);
      });
      item.appendChild(close);

      item.addEventListener('click', function (event) {
        var id = Number(event.currentTarget.dataset.tabId);
        window.gitLensTabbar.activateTab(id);
      });
      tabsEl.appendChild(item);
    }
  }

  // 排除拖动源后按标签中点确定插入空隙，左右移动使用同一套位置语义。
  function dropPosition(clientX) {
    var candidates = Array.from(tabsEl.children).filter(function (item) {
      return Number(item.dataset.tabId) !== dragId;
    });
    var before = candidates.find(function (item) {
      var rect = item.getBoundingClientRect();
      return clientX < rect.left + rect.width / 2;
    });
    var last = candidates[candidates.length - 1];
    return {
      beforeId: before ? Number(before.dataset.tabId) : null,
      x: before ? before.getBoundingClientRect().left
        : last ? last.getBoundingClientRect().right : tabsEl.getBoundingClientRect().left,
    };
  }

  function showDropPosition() {
    var bounds = tabsEl.getBoundingClientRect();
    var position = dropPosition(dragX);
    dropIndicator.style.left = Math.max(bounds.left, Math.min(position.x, bounds.right - 2)) + 'px';
    dropIndicator.hidden = false;
  }

  // 标签溢出时靠近边缘持续滚动，允许一次拖到屏幕外的任意位置。
  function scrollDuringDrag() {
    if (dragId === null || dragX === null) return;
    var bounds = tabsEl.getBoundingClientRect();
    var edge = 32;
    var speed = dragX < bounds.left + edge ? -8
      : dragX > bounds.right - edge ? 8 : 0;
    tabsEl.scrollLeft += speed;
    showDropPosition();
    scrollFrame = requestAnimationFrame(scrollDuringDrag);
  }

  function clearDropPosition() {
    cancelAnimationFrame(scrollFrame);
    scrollFrame = null;
    dragX = null;
    dropIndicator.hidden = true;
  }

  function finishDrag() {
    clearDropPosition();
    dragId = null;
    document.body.classList.remove('tab-dragging');
    var source = tabsEl.querySelector('.dragging');
    if (source) source.classList.remove('dragging');
    if (pendingState) {
      var state = pendingState;
      pendingState = null;
      render(state);
    }
  }

  tabsEl.addEventListener('pointerdown', function (event) {
    pressedClose = Boolean(event.target.closest('.tab-close'));
  });
  tabsEl.addEventListener('dragstart', function (event) {
    var item = event.target.closest('.tab');
    if (!item || pressedClose || event.target.closest('.tab-close')) {
      event.preventDefault();
      return;
    }
    dragId = Number(item.dataset.tabId);
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', String(dragId));
    document.body.classList.add('tab-dragging');
    item.classList.add('dragging');
  });
  tabsEl.addEventListener('dragover', function (event) {
    if (dragId === null) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    dragX = event.clientX;
    showDropPosition();
    if (scrollFrame === null) scrollFrame = requestAnimationFrame(scrollDuringDrag);
  });
  tabsEl.addEventListener('dragleave', function (event) {
    if (!tabsEl.contains(event.relatedTarget)) clearDropPosition();
  });
  tabsEl.addEventListener('drop', function (event) {
    if (dragId === null) return;
    event.preventDefault();
    var id = dragId;
    var beforeId = dropPosition(event.clientX).beforeId;
    finishDrag();
    window.gitLensTabbar.moveTab(id, beforeId);
  });
  document.addEventListener('dragend', finishDrag);

  window.gitLensTabbar.onTabsChanged(render);
  // 契约 §17.1.1：订阅窗口全屏态（主进程在进出全屏及本页加载完成时推送），
  // body.fullscreen 驱动 CSS 取消 darwin 左侧红绿灯安全区（标签吸附靠左）
  window.gitLensTabbar.onFullscreenChanged(function (fullscreen) {
    document.body.classList.toggle('fullscreen', Boolean(fullscreen));
  });
  newTabEl.addEventListener('click', function () {
    window.gitLensTabbar.newTab();
  });
</script>
</body>
</html>
