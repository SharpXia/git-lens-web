<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Git Lens 标签条</title>
<style>
  /* 自足样式：暗色主题与应用一致（Linear 视觉语言：近黑底 + 细边框 + 靛蓝强调，
     与 public/app.css 的 :root 令牌同源换算）。
     本页为 Shell 自有 chrome（file:// 本地加载、无远程资源），不属于契约 §14
     的服务端 CSP 范围；所有动态文案一律经 textContent 写入，无注入面。
     几何约束：高度 38px 与红绿灯区 78px 是主进程对位契约，不得改动。 */
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: "Inter", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #bar {
    display: flex;
    align-items: stretch;
    height: 38px;
    background: #050506;
    border-bottom: 1px solid #1f2023;
    /* 契约 §17：标签条兼任标题栏——空白区可拖动窗口，系统双击缩放行为沿用 */
    -webkit-app-region: drag;
  }
  /* 契约 §17：交互元素一律 no-drag（标签项、关闭 ×、新建 +），保证点击可达 */
  .tab, .tab-close, #new-tab { -webkit-app-region: no-drag; }
  #window-controls, .traffic-light { -webkit-app-region: no-drag; }
  /* 窗口态原生红绿灯区由主进程在视图边界外保留（78px）；macOS 全屏态系统收起原生红绿灯，
     由 #window-controls 在标签栏左侧原位（78px）渲染常驻红绿灯，保持左上角操作与标签对齐一致。 */
  /* 全屏标签栏贴着屏幕顶边，空白处也不能启动系统窗口拖动与桌面选择。 */
  body.fullscreen[data-platform="darwin"] #bar { -webkit-app-region: no-drag; }
  #window-controls {
    display: none;
    flex: none;
    box-sizing: border-box;
    width: 78px;
    padding-left: 12px;
    align-items: center;
    gap: 8px;
  }
  body.fullscreen[data-platform="darwin"] #window-controls {
    display: flex;
  }
  .traffic-light {
    position: relative;
    width: 12px;
    height: 12px;
    padding: 0;
    margin: 0;
    border-radius: 50%;
    border: 0.5px solid rgba(0, 0, 0, 0.22);
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    outline: none;
  }
  .traffic-light.close {
    background: #ff5f57;
    color: #4c0002;
  }
  .traffic-light.close:active { background: #bf4942; }
  .traffic-light.minimize {
    background: #febc2e;
    color: #5c4002;
  }
  .traffic-light.minimize:active { background: #bf8e22; }
  .traffic-light.fullscreen {
    background: #28c840;
    color: #004d0d;
  }
  .traffic-light.fullscreen:active { background: #1d9730; }
  .traffic-light svg {
    width: 8px;
    height: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s ease;
  }
  #window-controls:hover .traffic-light svg,
  .traffic-light:focus-visible svg {
    opacity: 1;
  }
  /* 非 darwin（含 unknown 回落）：右侧为系统 overlay 窗口控制按钮留位（≥140px，
     契约 §17；win/linux 真机未验收） */
  body:not([data-platform="darwin"]) #bar { padding-right: 140px; }
  #tabs {
    display: flex;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    overflow-y: hidden;
    /* 隐藏横向滚动条：标签多时靠压缩宽度而不是出滚动条 */
    scrollbar-width: none;
    /* #tabs 不设 no-drag：标签未占满的空白区随 #bar 拖动窗口（浏览器惯例）。
       横向滚动只发生在标签溢出时——溢出后可视区几乎全被 .tab（no-drag）覆盖，
       滚轮事件落在 no-drag 元素上不受拖拽区吞事件影响；不溢出时无滚动需求。
       取舍详见交付报告。 */
  }
  #tabs::-webkit-scrollbar { display: none; }
  /* 排序期间整条栏都接收指针事件，红绿灯留白、更新徽章与新建按钮上均可落位。 */
  body.tab-dragging #bar { -webkit-app-region: no-drag; }
  .tab, .tab * { -webkit-user-drag: none; }
  .tab { touch-action: none; }
  .tab.dragging { opacity: 0.45; }
  body.tab-dragging, body.tab-dragging * { cursor: grabbing; }
  #drag-preview {
    position: fixed;
    left: 0;
    top: 0;
    min-width: 0;
    max-width: none;
    border: 1px solid #717de0;
    border-radius: 5px;
    background: #141517;
    color: #eef0f3;
    opacity: 0.94;
    box-shadow: 0 3px 12px #0008;
    pointer-events: none;
    -webkit-app-region: no-drag;
    z-index: 2;
    will-change: transform;
  }
  #drop-indicator {
    position: fixed;
    top: 3px;
    width: 2px;
    height: 32px;
    background: #717de0;
    pointer-events: none;
    z-index: 3;
  }
  .tab, .tab-drag-preview {
    display: flex;
    align-items: center;
    gap: 6px;
    box-sizing: border-box;
    min-width: 120px;
    max-width: 220px;
    flex: 0 1 auto;
    padding: 0 8px 0 12px;
    border-right: 1px solid #1f2023;
    color: #8a8f98;
    font-size: 12px;
    line-height: 1;
    cursor: default;
  }
  .tab.active {
    background: #141517;
    color: #eef0f3;
    /* 激活态顶边高亮，与编辑器类应用的标签语义一致 */
    box-shadow: inset 0 2px 0 #717de0;
  }
  .tab-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tab-close {
    flex: none;
    width: 18px;
    height: 18px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: inherit;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }
  .tab-close:hover { background: #1f2023; color: #eef0f3; }
  #new-tab {
    flex: none;
    width: 34px;
    border: none;
    border-left: 1px solid #1f2023;
    background: transparent;
    color: #8a8f98;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  #new-tab:hover { background: #141517; color: #eef0f3; }
  /* 应用内更新进度（gitLensTabbar.onUpdateProgress）：细进度条贴标签栏下缘，
     阶段文案走右侧胶囊；均为只读展示，不设 no-drag，保持标题栏可拖拽 */
  #update-progress-track {
    height: 2px;
  }
  #update-progress-track[hidden] { display: none; }
  #update-progress {
    height: 100%;
    width: 0;
    background: #717de0;
    transition: width 0.3s ease-out;
  }
  #update-badge {
    display: none;
    flex: none;
    align-self: center;
    margin-right: 8px;
    padding: 3px 10px;
    border: 1px solid #5e6ad2;
    border-radius: 10px;
    background: #1e2245;
    color: #9aa5ee;
    font-size: 11px;
    line-height: 1.2;
    white-space: nowrap;
  }
  #update-badge.visible { display: flex; }
</style>
</head>
<body>
<div id="bar" role="tablist" aria-label="标签页">
  <div id="window-controls" role="group" aria-label="窗口控制">
    <button type="button" class="traffic-light close" data-window-action="close" title="关闭窗口" aria-label="关闭窗口">
      <svg viewBox="0 0 8 8" aria-hidden="true">
        <path d="M1.5 1.5L6.5 6.5M6.5 1.5L1.5 6.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
      </svg>
    </button>
    <button type="button" class="traffic-light minimize" data-window-action="minimize" title="最小化" aria-label="最小化">
      <svg viewBox="0 0 8 8" aria-hidden="true">
        <path d="M1.25 4H6.75" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
      </svg>
    </button>
    <button type="button" class="traffic-light fullscreen" data-window-action="leave-fullscreen" title="退出全屏 (⌃⌘F)" aria-label="退出全屏">
      <svg viewBox="0 0 8 8" aria-hidden="true">
        <path d="M1.2 4.6H3.4V6.8M6.8 3.4H4.6V1.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div id="tabs"></div>
  <div id="update-badge" role="status" aria-live="polite"></div>
  <button id="new-tab" type="button" title="新建标签页 (⌘T)" aria-label="新建标签页">+</button>
</div>
<div id="update-progress-track" hidden><div id="update-progress"></div></div>
<div id="drop-indicator" hidden></div>
<script>
  'use strict';
  // 契约 §17：主进程经 loadFile query 注入平台标识，置到 body[data-platform]
  // 驱动 CSS 分支（darwin 左侧红绿灯安全区 / 其余平台右侧 overlay 控件区）。
  // 白名单外的取值一律按 unknown 处理，样式回落非 darwin 分支（保守预留右留白）
  var KNOWN_PLATFORMS = ['darwin', 'win32', 'linux'];
  var platform = 'unknown';
  try {
    var requested = new URLSearchParams(location.search).get('platform');
    if (KNOWN_PLATFORMS.indexOf(requested) !== -1) platform = requested;
  } catch (err) {
    // query 解析失败按 unknown 处理
  }
  document.body.dataset.platform = platform;

  var tabsEl = document.getElementById('tabs');
  var barEl = document.getElementById('bar');
  var newTabEl = document.getElementById('new-tab');
  var dropIndicator = document.getElementById('drop-indicator');
  var dragId = null;
  var dragX = null;
  var scrollFrame = null;
  var pendingState = null;
  var pointerDrag = null;
  var dragPreview = null;
  var suppressClick = false;

  // 标题与激活态可能在拖动途中更新，延后渲染以免移除拖动源而中断手势。
  function render(state) {
    if (pointerDrag !== null) {
      pendingState = state;
      return;
    }
    tabsEl.textContent = '';
    for (var tab of state.tabs) {
      var item = document.createElement('div');
      item.className = 'tab' + (tab.active ? ' active' : '');
      item.setAttribute('role', 'tab');
      item.setAttribute('aria-selected', tab.active ? 'true' : 'false');
      item.dataset.tabId = String(tab.id);
      // 排序只在应用内完成，不向系统发起可跨桌面的原生拖放会话。
      item.draggable = false;

      var title = document.createElement('span');
      title.className = 'tab-title';
      title.textContent = tab.title;
      title.title = tab.title;
      item.appendChild(title);

      var close = document.createElement('button');
      close.type = 'button';
      close.className = 'tab-close';
      close.textContent = '×';
      close.setAttribute('aria-label', '关闭标签页 ' + tab.title);
      close.addEventListener('click', function (event) {
        // 阻止冒泡：点击 × 只关标签，不触发整条标签的切换
        event.stopPropagation();
        var id = Number(event.currentTarget.parentElement.dataset.tabId);
        window.gitLensTabbar.closeTab(id);
      });
      item.appendChild(close);

      item.addEventListener('click', function (event) {
        var id = Number(event.currentTarget.dataset.tabId);
        window.gitLensTabbar.activateTab(id);
      });
      tabsEl.appendChild(item);
    }
  }

  // 排除拖动源后按标签中点确定插入空隙，左右移动使用同一套位置语义。
  function dropPosition(clientX) {
    var candidates = Array.from(tabsEl.children).filter(function (item) {
      return Number(item.dataset.tabId) !== dragId;
    });
    var before = candidates.find(function (item) {
      var rect = item.getBoundingClientRect();
      return clientX < rect.left + rect.width / 2;
    });
    var last = candidates[candidates.length - 1];
    return {
      beforeId: before ? Number(before.dataset.tabId) : null,
      x: before ? before.getBoundingClientRect().left
        : last ? last.getBoundingClientRect().right : tabsEl.getBoundingClientRect().left,
    };
  }

  function showDropPosition() {
    var bounds = tabsEl.getBoundingClientRect();
    var position = dropPosition(dragX);
    dropIndicator.style.left = Math.max(bounds.left, Math.min(position.x, bounds.right - 2)) + 'px';
    dropIndicator.hidden = false;
  }

  // 标签溢出时靠近边缘持续滚动，允许一次拖到屏幕外的任意位置。
  function scrollDuringDrag() {
    if (dragId === null || dragX === null) return;
    var bounds = tabsEl.getBoundingClientRect();
    var edge = 32;
    var speed = dragX < bounds.left + edge ? -8
      : dragX > bounds.right - edge ? 8 : 0;
    tabsEl.scrollLeft += speed;
    showDropPosition();
    scrollFrame = requestAnimationFrame(scrollDuringDrag);
  }

  function clearDropPosition() {
    cancelAnimationFrame(scrollFrame);
    scrollFrame = null;
    dragX = null;
    dropIndicator.hidden = true;
  }

  function moveDragPreview(event) {
    if (!dragPreview || !pointerDrag) return;
    var x = Math.max(0, Math.min(event.clientX - pointerDrag.offsetX, innerWidth - dragPreview.offsetWidth));
    var y = Math.max(0, Math.min(event.clientY - pointerDrag.offsetY, innerHeight - dragPreview.offsetHeight));
    dragPreview.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
  }

  function createDragPreview(event) {
    var bounds = pointerDrag.item.getBoundingClientRect();
    dragPreview = pointerDrag.item.cloneNode(true);
    dragPreview.id = 'drag-preview';
    dragPreview.className = 'tab-drag-preview';
    dragPreview.removeAttribute('role');
    dragPreview.removeAttribute('aria-selected');
    dragPreview.removeAttribute('data-tab-id');
    dragPreview.setAttribute('aria-hidden', 'true');
    dragPreview.inert = true;
    dragPreview.style.width = bounds.width + 'px';
    dragPreview.style.height = bounds.height + 'px';
    document.body.appendChild(dragPreview);
    // 标签条视图临时扩展为透明浮层，预览移到内容区时仍可见，不创建系统拖放会话。
    window.gitLensTabbar.setDragging(true);
    moveDragPreview(event);
  }

  function finishDrag() {
    var pointer = pointerDrag;
    if (dragId !== null) suppressClick = true;
    pointerDrag = null;
    if (dragPreview) {
      dragPreview.remove();
      dragPreview = null;
      window.gitLensTabbar.setDragging(false);
    }
    clearDropPosition();
    dragId = null;
    document.body.classList.remove('tab-dragging');
    var source = tabsEl.querySelector('.dragging');
    if (source) source.classList.remove('dragging');
    if (pointer && pointer.item.hasPointerCapture(pointer.id)) {
      pointer.item.releasePointerCapture(pointer.id);
    }
    if (pendingState) {
      var state = pendingState;
      pendingState = null;
      render(state);
    }
  }

  function isInsideBar(event) {
    var bounds = barEl.getBoundingClientRect();
    return event.clientX >= bounds.left && event.clientX <= bounds.right
      && event.clientY >= bounds.top && event.clientY < bounds.bottom;
  }

  barEl.addEventListener('pointerdown', function (event) {
    if (event.button !== 0 || !event.isPrimary || pointerDrag !== null) return;
    suppressClick = false;
    var item = event.target.closest('.tab');
    if (!item || event.target.closest('.tab-close')) return;
    var bounds = item.getBoundingClientRect();
    pointerDrag = {
      id: event.pointerId, item: item, x: event.clientX, y: event.clientY,
      offsetX: event.clientX - bounds.left, offsetY: event.clientY - bounds.top,
    };
    // 捕获到标签自身，跨过按钮或移出标签栏仍能收到松手；普通点击仍落在原标签。
    item.setPointerCapture(event.pointerId);
  });
  barEl.addEventListener('pointermove', function (event) {
    if (!pointerDrag || event.pointerId !== pointerDrag.id) return;
    if (!(event.buttons & 1)) {
      finishDrag();
      return;
    }
    // 小幅手抖仍按点击处理，避免切换标签时意外排序。
    if (dragId === null) {
      if (Math.hypot(event.clientX - pointerDrag.x, event.clientY - pointerDrag.y) < 5) return;
      dragId = Number(pointerDrag.item.dataset.tabId);
      document.body.classList.add('tab-dragging');
      pointerDrag.item.classList.add('dragging');
      createDragPreview(event);
    }
    event.preventDefault();
    moveDragPreview(event);
    if (!isInsideBar(event)) {
      clearDropPosition();
      return;
    }
    dragX = event.clientX;
    showDropPosition();
    if (scrollFrame === null) scrollFrame = requestAnimationFrame(scrollDuringDrag);
  });
  barEl.addEventListener('pointerup', function (event) {
    if (!pointerDrag || event.pointerId !== pointerDrag.id) return;
    var id = dragId;
    var shouldMove = id !== null && isInsideBar(event);
    var beforeId = shouldMove ? dropPosition(event.clientX).beforeId : null;
    if (id !== null) event.preventDefault();
    finishDrag();
    if (shouldMove) window.gitLensTabbar.moveTab(id, beforeId);
  });
  for (var eventName of ['pointercancel', 'lostpointercapture']) {
    barEl.addEventListener(eventName, function (event) {
      if (pointerDrag && event.pointerId === pointerDrag.id) finishDrag();
    });
  }
  barEl.addEventListener('click', function (event) {
    // 拖动完成后的兼容 click 不能激活拖动源、关闭标签或点击「+」。
    if (!suppressClick) return;
    suppressClick = false;
    event.preventDefault();
    event.stopImmediatePropagation();
  }, true);
  barEl.addEventListener('dragstart', function (event) {
    event.preventDefault();
  });
  window.addEventListener('blur', finishDrag);
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && pointerDrag) {
      event.preventDefault();
      finishDrag();
    }
  });

  window.gitLensTabbar.onTabsChanged(render);
  // 契约 §17.1.1：订阅窗口全屏态（主进程在进出全屏及本页加载完成时推送），
  // 禁用全屏标签区的窗口拖动，并在 macOS 全屏态下展示左上角常驻红绿灯。
  window.gitLensTabbar.onFullscreenChanged(function (fullscreen) {
    finishDrag();
    document.body.classList.toggle('fullscreen', Boolean(fullscreen));
  });

  var windowControlsEl = document.getElementById('window-controls');
  windowControlsEl.addEventListener('click', function (event) {
    var button = event.target.closest('[data-window-action]');
    if (!button) return;
    window.gitLensTabbar.windowControl(button.dataset.windowAction);
  });

  var updateTrack = document.getElementById('update-progress-track');
  var updateBar = document.getElementById('update-progress');
  var updateBadge = document.getElementById('update-badge');

  // 阶段 → 只读展示：下载画细进度条与百分比，校验/就绪保留胶囊文案，空闲全部隐藏
  function renderUpdateProgress(progress) {
    if (!progress) {
      updateTrack.hidden = true;
      updateBadge.classList.remove('visible');
      updateBadge.textContent = '';
      return;
    }
    updateBadge.classList.add('visible');
    if (progress.phase === 'download') {
      updateTrack.hidden = false;
      updateBar.style.width = progress.percent + '%';
      updateBadge.textContent = '下载更新 ' + progress.percent + '%';
    } else if (progress.phase === 'verify') {
      updateTrack.hidden = true;
      updateBadge.textContent = '正在校验更新…';
    } else {
      updateTrack.hidden = true;
      updateBadge.textContent = '重启安装更新';
    }
  }
  window.gitLensTabbar.onUpdateProgress(renderUpdateProgress);

  newTabEl.addEventListener('click', function () {
    window.gitLensTabbar.newTab();
  });
</script>
</body>
</html>
