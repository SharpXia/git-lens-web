<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Lens · 本地仓库透镜与代码 Diff 审计</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-alt: #21262d;
      --border: #30363d;
      --border-muted: #21262d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --text-bright: #f0f6fc;
      --accent: #58a6ff;
      --danger: #f85149;
      --warning: #d29922;
      --success: #3fb950;
      --star-color: #e3b341;
      --diff-add-bg: rgba(46, 160, 67, 0.15);
      --diff-add-text: #3fb950;
      --diff-del-bg: rgba(248, 81, 73, 0.15);
      --diff-del-text: #f85149;
      --diff-hunk-bg: rgba(56, 139, 253, 0.15);
      --diff-hunk-text: #79c0ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--text-bright); }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(88, 166, 255, 0.3);
      font-weight: 500;
      white-space: nowrap;
    }
    .badge-danger {
      background: rgba(248, 81, 73, 0.15);
      color: var(--danger);
      border-color: rgba(248, 81, 73, 0.3);
    }
    .badge-warning {
      background: rgba(210, 153, 34, 0.15);
      color: var(--warning);
      border-color: rgba(210, 153, 34, 0.3);
    }
    .badge-success {
      background: rgba(63, 185, 80, 0.15);
      color: var(--success);
      border-color: rgba(63, 185, 80, 0.3);
    }

    /* 顶部导航与标签页切换 */
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      color: var(--text-bright);
      background: var(--card-bg);
    }
    .tab-btn.active {
      color: var(--accent);
      background: var(--card-bg);
      border-color: var(--border);
      font-weight: 600;
    }

    /* 仓库搜索与选择栏容器 */
    .project-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
    }
    select, button, input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); }
    button {
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s, opacity 0.2s;
    }
    button:hover { border-color: var(--accent); }
    button.btn-danger {
      color: var(--danger);
      border-color: rgba(248, 81, 73, 0.4);
    }
    button.btn-danger:hover {
      background: rgba(248, 81, 73, 0.15);
      border-color: var(--danger);
    }
    button.btn-primary {
      background: #238636;
      border-color: #2ea043;
      color: #fff;
    }
    button.btn-primary:hover { background: #2ea043; }
    button.btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.btn-outline:hover {
      background: var(--card-alt);
      color: var(--accent);
    }

    /* 仓库自定义下拉菜单与模糊搜索 */
    .repo-picker-wrapper {
      position: relative;
      display: inline-block;
      min-width: 320px;
      max-width: 480px;
      flex: 1 1 320px;
    }
    .repo-trigger {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .repo-trigger:hover {
      border-color: var(--accent);
    }
    .repo-trigger-text {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .repo-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 100%;
      min-width: 380px;
      background: #161b22;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 1000;
      display: none;
      overflow: hidden;
    }
    .repo-dropdown.show {
      display: block;
    }
    .repo-search-box {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      background: var(--card-alt);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .repo-search-input {
      flex: 1;
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;
    }
    .repo-search-input:focus {
      border-color: var(--accent);
    }
    .filter-starred-btn {
      padding: 6px 10px;
      font-size: 12px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .filter-starred-btn.active {
      background: rgba(227, 179, 65, 0.15);
      border-color: var(--star-color);
      color: var(--star-color);
    }
    .repo-list-container {
      max-height: 320px;
      overflow-y: auto;
    }
    .repo-list-group-title {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.02);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .repo-item {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      font-size: 13px;
      transition: background 0.15s;
    }
    .repo-item:hover {
      background: var(--card-alt);
    }
    .repo-item.selected {
      background: rgba(88, 166, 255, 0.12);
      border-left: 3px solid var(--accent);
    }
    .repo-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }
    .repo-item-name {
      font-weight: 600;
      color: var(--text-bright);
    }
    .repo-item-group {
      font-size: 11px;
      color: var(--text-muted);
    }
    .star-icon {
      cursor: pointer;
      font-size: 14px;
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s, transform 0.15s;
    }
    .star-icon:hover {
      color: var(--star-color);
      transform: scale(1.15);
    }
    .star-icon.starred {
      color: var(--star-color);
    }

    #searchInput {
      flex: 1 1 200px;
      min-width: 180px;
      max-width: 360px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .metric-title { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
    .metric-val { font-size: 24px; font-weight: 700; color: var(--text-bright); }

    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 960px) {
      .panels { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-header h2 { font-size: 15px; font-weight: 600; color: var(--text-bright); }
    .list-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 16px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .list-item:last-child { border-bottom: none; }
    .item-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item-header-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .item-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 6px;
      word-break: break-word;
    }
    .item-tags {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .item-tags .badge {
      max-width: 380px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-path-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--text-muted);
      width: fit-content;
      max-width: 100%;
      word-break: break-all;
    }
    .item-path-text {
      color: #8b949e;
      user-select: all;
    }
    .copy-path-btn {
      background: transparent;
      border: none;
      padding: 2px 4px;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      opacity: 0.6;
      border-radius: 4px;
      transition: opacity 0.15s, color 0.15s;
    }
    .copy-path-btn:hover {
      opacity: 1;
      color: var(--accent);
      border: none;
    }
    .item-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .item-alert {
      font-size: 12px;
      color: var(--warning);
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(210, 153, 34, 0.1);
      border: 1px solid rgba(210, 153, 34, 0.25);
      padding: 4px 8px;
      border-radius: 4px;
      width: fit-content;
    }
    .item-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      flex-shrink: 0;
      gap: 6px;
    }
    .item-actions-diff-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .item-actions .btn-outline,
    .item-actions .btn-danger {
      text-align: center;
      box-sizing: border-box;
      font-size: 12px;
      padding: 4px 10px;
      white-space: nowrap;
    }
    .item-actions .btn-remove-wt {
      margin-top: auto;
    }
    .loading { color: var(--text-muted); padding: 32px; text-align: center; }

    /* Diff 视图容器样式 */
    .diff-view-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .diff-picker-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }
    .picker-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1 1 300px;
    }
    .picker-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .picker-select {
      width: 100%;
      padding: 8px 12px;
    }
    .swap-btn {
      padding: 8px 12px;
      align-self: flex-end;
      margin-bottom: 2px;
    }
    .diff-summary-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .stat-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 14px;
      align-items: center;
      color: var(--text-bright);
    }
    .add-count { color: var(--success); font-weight: 600; }
    .del-count { color: var(--danger); font-weight: 600; }

    /* 文件列表与手风琴 Diff 组件 */
    .diff-tools-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      margin-top: 16px;
      border-bottom: none;
    }
    .diff-tools-left {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .diff-tools-right {
      display: flex;
      gap: 8px;
    }

    .file-diff-card {
      background: #090d13;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      border-radius: 6px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .file-diff-card:hover {
      border-color: #444c56;
    }
    .file-diff-card.expanded {
      border-color: #388bfd66;
    }
    .file-header {
      background: #161b22;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid transparent;
      transition: background 0.15s;
    }
    .file-header:hover {
      background: #1c2128;
    }
    .file-diff-card.expanded .file-header {
      border-bottom-color: var(--border);
    }
    .file-title-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-bright);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    .file-status-badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
    .status-modified { background: rgba(210, 153, 34, 0.2); color: var(--warning); border: 1px solid rgba(210, 153, 34, 0.4); }
    .status-added { background: rgba(63, 185, 80, 0.2); color: var(--success); border: 1px solid rgba(63, 185, 80, 0.4); }
    .status-deleted { background: rgba(248, 81, 73, 0.2); color: var(--danger); border: 1px solid rgba(248, 81, 73, 0.4); }

    .file-arrow {
      color: var(--text-muted);
      font-size: 11px;
      transition: transform 0.2s;
    }
    .file-diff-card.expanded .file-arrow {
      transform: rotate(90deg);
    }
    .file-body {
      display: none;
    }
    .file-diff-card.expanded .file-body {
      display: block;
    }

    .diff-pre {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.6;
      padding: 8px 0;
      overflow-x: auto;
      margin: 0;
      background: #090d13;
    }
    .diff-line {
      padding: 1px 16px;
      white-space: pre;
      display: block;
    }
    .diff-line.line-add {
      background-color: var(--diff-add-bg);
      color: var(--diff-add-text);
    }
    .diff-line.line-del {
      background-color: var(--diff-del-bg);
      color: var(--diff-del-text);
    }
    .diff-line.line-hunk {
      background-color: var(--diff-hunk-bg);
      color: var(--diff-hunk-text);
      font-weight: 600;
    }
    .diff-line.line-file {
      background-color: rgba(255, 255, 255, 0.04);
      color: var(--text-bright);
      font-weight: 600;
      border-top: 1px solid var(--border-muted);
      border-bottom: 1px solid var(--border-muted);
      margin-top: 6px;
    }
    .empty-diff-box {
      padding: 48px;
      text-align: center;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🔍 Git Lens <span class="badge">Worktree & Branch Guard + Code Diff Inspector</span></h1>
    <span id="headerPath" style="font-size: 13px; color: var(--text-muted);"></span>
  </header>

  <!-- 顶部功能切换 TAB -->
  <div class="tab-bar">
    <button id="tabOverview" class="tab-btn active" onclick="switchTab('overview')">
      <span>📊 仓库总览与管理</span>
    </button>
    <button id="tabDiff" class="tab-btn" onclick="switchTab('diff')">
      <span>⚡ Worktree 差异对比 (Branch Diff)</span>
    </button>
  </div>

  <div class="project-bar">
    <label style="font-size: 13px; color: var(--text-muted);">选择本地仓库：</label>
    
    <!-- 智能搜索与星标收藏的仓库下拉选择器 -->
    <div class="repo-picker-wrapper" id="repoPickerWrapper">
      <div class="repo-trigger" id="repoTrigger" onclick="toggleRepoDropdown()">
        <div class="repo-trigger-text" id="repoTriggerText">
          <span>加载中...</span>
        </div>
        <span style="color: var(--text-muted); font-size: 11px;">▼</span>
      </div>

      <div class="repo-dropdown" id="repoDropdown">
        <div class="repo-search-box">
          <input type="text" id="repoFilterInput" class="repo-search-input" placeholder="模糊搜索仓库名或路径..." autocomplete="off">
          <button type="button" id="starredFilterBtn" class="btn-outline filter-starred-btn" onclick="toggleStarredOnlyFilter()">
            <span>⭐ 只看星标</span>
          </button>
        </div>
        <div class="repo-list-container" id="repoDropdownList">
          <div class="loading">加载仓库中...</div>
        </div>
      </div>
    </div>

    <!-- 兼容隐藏的原生选择器 -->
    <select id="repoSelect" style="display: none;"></select>

    <input id="searchInput" type="search" placeholder="搜索分支或 Worktree..." autocomplete="off" aria-label="搜索分支或 Worktree">
    <button id="refreshBtn" class="btn-outline">全量刷新</button>
    <button id="pruneBtn" class="btn-primary" style="margin-left: auto;">一键 Prune 无效引用</button>
  </div>

  <!-- TAB 1: 仓库透视与管理面板 -->
  <div id="viewOverview">
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">总 Worktree 数</div>
        <div id="mTotalWt" class="metric-val">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">可清理 / 失联 Worktree</div>
        <div id="mStaleWt" class="metric-val" style="color: var(--danger);">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">总本地分支数</div>
        <div id="mTotalBr" class="metric-val">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">冗余 / 过期分支</div>
        <div id="mRedundantBr" class="metric-val" style="color: var(--warning);">0</div>
      </div>
    </div>

    <div class="panels">
      <!-- Worktrees 面板 -->
      <div class="panel">
        <div class="panel-header">
          <h2>🌳 Git Worktrees 隔离工作区</h2>
          <span id="wtCountBadge" class="badge">0 个</span>
        </div>
        <div id="wtList">
          <div class="loading">加载中...</div>
        </div>
      </div>

      <!-- 分支透视面板 -->
      <div class="panel">
        <div class="panel-header">
          <h2>🌿 本地分支透视 (按冗余度排序)</h2>
          <span id="brCountBadge" class="badge">0 个</span>
        </div>
        <div id="brList">
          <div class="loading">加载中...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- TAB 2: Worktree Diff 对比视图 -->
  <div id="viewDiff" style="display: none;">
    <div class="diff-view-container">
      <div class="diff-picker-bar">
        <div class="picker-col">
          <label class="picker-label" for="diffBaseSelect">
            <span>基准工作区 (Base / 原始分支)：</span>
          </label>
          <select id="diffBaseSelect" class="picker-select"></select>
        </div>

        <button class="swap-btn btn-outline" onclick="swapDiffTargets()" title="对调两边工作区">⇄ 对调</button>

        <div class="picker-col">
          <label class="picker-label" for="diffTargetSelect">
            <span>对比工作区 (Target / 变更分支)：</span>
          </label>
          <select id="diffTargetSelect" class="picker-select"></select>
        </div>

        <button class="btn-primary" style="align-self: flex-end; margin-bottom: 2px;" onclick="fetchAndRenderDiff()">比对工作区 Diff</button>
      </div>

      <div id="diffResultsContainer">
        <div class="empty-diff-box">
          <div style="font-size: 16px; margin-bottom: 8px;">请选择两个不同的 Worktree 进行比对，或在总览列表点击【查看未提交代码】</div>
          <div style="font-size: 13px;">支持跨工作区领先改动对比与本地未提交（Dirty）代码审查</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allRepos = [];
    let currentRepo = '';
    let currentWorktrees = [];
    let currentBranches = [];
    let currentMainBranch = '';
    let searchKeyword = '';
    let repoFilterKeyword = '';
    let filterStarredOnly = false;
    let activeTab = 'overview';

    const STARRED_STORAGE_KEY = 'git_lens_starred_repos';

    function getStarredRepos() {
      try {
        const raw = localStorage.getItem(STARRED_STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function isRepoStarred(repoPath) {
      const stars = getStarredRepos();
      return stars.includes(repoPath);
    }

    function toggleStarRepo(repoPath, e) {
      if (e) e.stopPropagation();
      let stars = getStarredRepos();
      if (stars.includes(repoPath)) {
        stars = stars.filter(p => p !== repoPath);
      } else {
        stars.push(repoPath);
      }
      localStorage.setItem(STARRED_STORAGE_KEY, JSON.stringify(stars));
      renderRepoDropdownList();
      updateRepoTriggerText();
    }

    function toggleStarredOnlyFilter() {
      filterStarredOnly = !filterStarredOnly;
      const btn = document.getElementById('starredFilterBtn');
      if (filterStarredOnly) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
      renderRepoDropdownList();
    }

    function toggleRepoDropdown() {
      const dd = document.getElementById('repoDropdown');
      const isShow = dd.classList.contains('show');
      if (isShow) {
        dd.classList.remove('show');
      } else {
        dd.classList.add('show');
        const inp = document.getElementById('repoFilterInput');
        setTimeout(() => inp.focus(), 50);
      }
    }

    document.addEventListener('click', (e) => {
      const wrapper = document.getElementById('repoPickerWrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        document.getElementById('repoDropdown').classList.remove('show');
      }
    });

    function renderRepoDropdownList() {
      const container = document.getElementById('repoDropdownList');
      const kw = repoFilterKeyword.trim().toLowerCase();
      const starred = getStarredRepos();

      let filtered = allRepos.filter(r => {
        const matchesKw = !kw || r.name.toLowerCase().includes(kw) || r.path.toLowerCase().includes(kw) || (r.group && r.group.toLowerCase().includes(kw));
        const matchesStar = !filterStarredOnly || starred.includes(r.path);
        return matchesKw && matchesStar;
      });

      // 排序：已星标的置顶排前面，其余按拼音/字母排序
      filtered.sort((a, b) => {
        const aStar = starred.includes(a.path) ? 1 : 0;
        const bStar = starred.includes(b.path) ? 1 : 0;
        if (aStar !== bStar) return bStar - aStar;
        return a.name.localeCompare(b.name);
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="loading" style="padding: 20px;">没有匹配的仓库</div>`;
        return;
      }

      container.innerHTML = '';

      // 分组渲染：星标仓库区 & 普通分组
      const starredItems = filtered.filter(r => starred.includes(r.path));
      const normalItems = filtered.filter(r => !starred.includes(r.path));

      if (starredItems.length > 0 && !filterStarredOnly) {
        const gTitle = document.createElement('div');
        gTitle.className = 'repo-list-group-title';
        gTitle.textContent = `⭐ 星标收藏 (${starredItems.length})`;
        container.appendChild(gTitle);

        starredItems.forEach(r => {
          container.appendChild(createRepoItemDom(r, true));
        });
      }

      // 其他仓库按 group 组织
      const groups = {};
      normalItems.forEach(r => {
        const g = r.group || '其他仓库';
        if (!groups[g]) groups[g] = [];
        groups[g].push(r);
      });

      Object.keys(groups).forEach(gName => {
        const gTitle = document.createElement('div');
        gTitle.className = 'repo-list-group-title';
        gTitle.textContent = `${gName} (${groups[gName].length})`;
        container.appendChild(gTitle);

        groups[gName].forEach(r => {
          container.appendChild(createRepoItemDom(r, false));
        });
      });
    }

    function createRepoItemDom(repo, isStarred) {
      const item = document.createElement('div');
      item.className = 'repo-item' + (repo.path === currentRepo ? ' selected' : '');
      item.onclick = () => {
        selectRepo(repo.path);
        document.getElementById('repoDropdown').classList.remove('show');
      };

      item.innerHTML = `
        <div class="repo-item-left">
          <span class="repo-item-name">${escapeHtml(repo.name)}</span>
          <span class="repo-item-group">${escapeHtml(repo.group || '')}</span>
        </div>
        <span class="star-icon ${isStarred ? 'starred' : ''}" title="${isStarred ? '取消收藏' : '加入星标'}" onclick="toggleStarRepo('${escapeHtml(repo.path)}', event)">
          ${isStarred ? '★' : '☆'}
        </span>
      `;
      return item;
    }

    function updateRepoTriggerText() {
      const repo = allRepos.find(r => r.path === currentRepo);
      const textDom = document.getElementById('repoTriggerText');
      if (repo) {
        const starred = isRepoStarred(repo.path);
        textDom.innerHTML = `
          ${starred ? '<span style="color: var(--star-color);">★</span>' : ''}
          <span style="font-weight: 600; color: var(--text-bright);">${escapeHtml(repo.name)}</span>
          <span style="font-size: 12px; color: var(--text-muted);">[${escapeHtml(repo.group || '')}]</span>
        `;
      } else {
        textDom.innerHTML = `<span>未选择仓库</span>`;
      }
    }

    function selectRepo(repoPath) {
      if (!repoPath || repoPath === currentRepo) return;
      currentRepo = repoPath;
      document.getElementById('repoSelect').value = repoPath;
      updateRepoTriggerText();
      renderRepoDropdownList();
      inspectRepo(repoPath);
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tabOverview').className = tab === 'overview' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('tabDiff').className = tab === 'diff' ? 'tab-btn active' : 'tab-btn';

      document.getElementById('viewOverview').style.display = tab === 'overview' ? 'block' : 'none';
      document.getElementById('viewDiff').style.display = tab === 'diff' ? 'block' : 'none';

      if (tab === 'diff') {
        populateDiffSelectors();
      }
    }

    async function loadProjects() {
      const res = await fetch('/api/projects');
      const data = await res.json();
      allRepos = data.repos || [];

      const sel = document.getElementById('repoSelect');
      sel.innerHTML = '';
      if (allRepos.length > 0) {
        allRepos.forEach(r => {
          const opt = document.createElement('option');
          opt.value = r.path;
          opt.textContent = `[${r.group}] ${r.name}`;
          sel.appendChild(opt);
        });

        // 优先默认选中第一个星标仓库，若无则选第一个仓库
        const starred = getStarredRepos();
        const firstStarred = allRepos.find(r => starred.includes(r.path));
        currentRepo = firstStarred ? firstStarred.path : allRepos[0].path;

        sel.value = currentRepo;
        updateRepoTriggerText();
        renderRepoDropdownList();
        inspectRepo(currentRepo);
      } else {
        sel.innerHTML = '<option value="">未扫描到仓库</option>';
        document.getElementById('repoTriggerText').textContent = '未扫描到仓库';
      }
    }

    async function inspectRepo(repoPath) {
      if (!repoPath) return;
      currentRepo = repoPath;
      document.getElementById('headerPath').textContent = repoPath;
      document.getElementById('wtList').innerHTML = '<div class="loading">正在分析 Worktrees...</div>';
      document.getElementById('brList').innerHTML = '<div class="loading">正在分析分支...</div>';

      try {
        const res = await fetch(`/api/inspect?path=${encodeURIComponent(repoPath)}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        currentWorktrees = data.worktrees || [];
        currentBranches = data.branches || [];
        currentMainBranch = data.mainBranch;

        updateMetrics();
        renderFilteredLists();
        populateDiffSelectors();
      } catch (err) {
        alert('分析失败: ' + err.message);
      }
    }

    function updateMetrics() {
      const staleWt = currentWorktrees.filter(w => !w.isMain && (!w.existsOnDisk || w.isPrunable));
      const redundantBr = currentBranches.filter(b => b.redundancyReason);

      document.getElementById('mTotalWt').textContent = currentWorktrees.length;
      document.getElementById('mStaleWt').textContent = staleWt.length;
      document.getElementById('mTotalBr').textContent = currentBranches.length;
      document.getElementById('mRedundantBr').textContent = redundantBr.length;
    }

    function includesKeyword(values, keyword) {
      return values.filter(Boolean).join(' ').toLocaleLowerCase().includes(keyword);
    }

    function renderFilteredLists() {
      const keyword = searchKeyword.trim().toLocaleLowerCase();
      const worktrees = keyword
        ? currentWorktrees.filter(wt => includesKeyword([wt.path, wt.branch, wt.lastCommit?.relativeTime, wt.lastCommit?.author, wt.lastCommit?.subject], keyword))
        : currentWorktrees;
      const branches = keyword
        ? currentBranches.filter(b => includesKeyword([b.name, b.relativeTime, b.author, b.subject, b.redundancyReason], keyword))
        : currentBranches;

      document.getElementById('wtCountBadge').textContent = keyword
        ? `${worktrees.length} / ${currentWorktrees.length} 个`
        : `${currentWorktrees.length} 个`;
      document.getElementById('brCountBadge').textContent = keyword
        ? `${branches.length} / ${currentBranches.length} 个`
        : `${currentBranches.length} 个`;

      renderWorktrees(worktrees, keyword);
      renderBranches(branches, currentMainBranch, keyword);
    }

    function renderWorktrees(worktrees, keyword) {
      const container = document.getElementById('wtList');
      if (!worktrees || worktrees.length === 0) {
        container.innerHTML = `<div class="loading">${keyword ? '没有匹配的 Worktree' : '无任何独立 Worktree'}</div>`;
        return;
      }
      container.innerHTML = '';
      worktrees.forEach(wt => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.id = 'wt-item-' + encodeURIComponent(wt.path).replace(/%/g, '_');

        const isSafeMain = wt.isMain;
        let tags = [];
        if (wt.isMain) tags.push('<span class="badge badge-success">Main 工作区</span>');
        if (wt.branch) tags.push(`<span class="badge" title="${escapeHtml(wt.branch)}">🌿 ${escapeHtml(wt.branch)}</span>`);
        if (!wt.existsOnDisk) tags.push('<span class="badge badge-danger">磁盘已失联</span>');
        if (wt.isDirty) tags.push(`<span class="badge badge-warning">未提交修改 (${wt.dirtyCount})</span>`);
        if (wt.isLocked) tags.push('<span class="badge">已加锁</span>');

        const dirName = wt.path.split('/').filter(Boolean).pop() || wt.path;
        let lastInfo = wt.lastCommit ? `最新提交: ${wt.lastCommit.relativeTime} by ${wt.lastCommit.author} · "${wt.lastCommit.subject}"` : '';

        div.innerHTML = `
          <div class="item-main">
            <div class="item-header-row">
              <div class="item-name" title="${escapeHtml(wt.path)}">
                <span>📁</span>
                <span>${escapeHtml(dirName)}</span>
              </div>
              <div class="item-tags">${tags.join(' ')}</div>
            </div>
            <div class="item-path-box">
              <span class="item-path-text">${escapeHtml(wt.path)}</span>
              <button class="copy-path-btn" onclick="copyText('${escapeHtml(wt.path)}', this)" title="复制完整路径">复制</button>
            </div>
            ${lastInfo ? `<div class="item-desc">${lastInfo}</div>` : ''}
            ${!wt.existsOnDisk || wt.isPrunable ? '<div class="item-alert">⚠️ 该 Worktree 已损坏或可被安全 prune 清理</div>' : ''}
          </div>
          <div class="item-actions">
            <div class="item-actions-diff-group">
              ${wt.isDirty ? `<button class="btn-outline" onclick="viewUncommittedDiff('${escapeHtml(wt.path)}')" style="color: var(--warning); border-color: rgba(210, 153, 34, 0.4);">未提交 Diff (${wt.dirtyCount})</button>` : ''}
              <button class="btn-outline" onclick="viewDiffAgainstMain('${escapeHtml(wt.path)}')">与主干对比</button>
            </div>
            ${!isSafeMain ? `<button class="btn-danger btn-remove-wt" id="btn-rm-wt-${encodeURIComponent(wt.path).replace(/%/g, '_')}" onclick="removeWt('${escapeHtml(wt.path)}')">移除</button>` : ''}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderBranches(branches, mainBranch, keyword) {
      const container = document.getElementById('brList');
      if (!branches || branches.length === 0) {
        container.innerHTML = `<div class="loading">${keyword ? '没有匹配的分支' : '无本地分支'}</div>`;
        return;
      }

      const sortedBranches = [...branches].sort((a, b) => {
        if (a.redundancyReason && !b.redundancyReason) return -1;
        if (!a.redundancyReason && b.redundancyReason) return 1;
        return b.daysOld - a.daysOld;
      });

      container.innerHTML = '';
      sortedBranches.forEach(b => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.id = 'br-item-' + encodeURIComponent(b.name).replace(/%/g, '_');

        let tags = [];
        if (b.isMain) tags.push('<span class="badge badge-success">主分支</span>');
        if (b.inUseByWorktree) tags.push('<span class="badge">🌳 Worktree 绑定中</span>');
        if (b.isMerged) tags.push('<span class="badge">已合入主干</span>');

        div.innerHTML = `
          <div class="item-main">
            <div class="item-header-row">
              <div class="item-name">
                <span>🌿</span>
                <span>${escapeHtml(b.name)}</span>
              </div>
              <div class="item-tags">${tags.join(' ')}</div>
            </div>
            <div class="item-desc">${b.relativeTime} 由 ${escapeHtml(b.author)} 提交: "${escapeHtml(b.subject || '-')}"</div>
            ${b.redundancyReason ? `<div class="item-alert">⚠️ ${escapeHtml(b.redundancyReason)}</div>` : ''}
          </div>
          <div class="item-actions">
            ${!b.isMain && !b.inUseByWorktree ? `<button class="btn-danger" id="btn-del-br-${encodeURIComponent(b.name).replace(/%/g, '_')}" onclick="delBranch('${escapeHtml(b.name)}', ${!b.isMerged})">删除</button>` : ''}
          </div>
        `;
        container.appendChild(div);
      });
    }

    /* 优化 1：精细化单个 Worktree 移除判断与单项 DOM 剔除 */
    async function removeWt(worktreePath) {
      if (!confirm(`确认从 Git 登记中移除 Worktree 目录:\n${worktreePath}`)) return;

      const domKey = encodeURIComponent(worktreePath).replace(/%/g, '_');
      const btn = document.getElementById(`btn-rm-wt-${domKey}`);
      if (btn) {
        btn.disabled = true;
        btn.textContent = '移除中...';
      }

      try {
        const res = await fetch('/api/remove-worktree', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repoPath: currentRepo, worktreePath, force: true })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        const checkRes = await fetch(`/api/check-worktree?path=${encodeURIComponent(currentRepo)}&worktree=${encodeURIComponent(worktreePath)}`);
        const checkData = await checkRes.json();

        if (!checkData.exists) {
          currentWorktrees = currentWorktrees.filter(w => w.path !== worktreePath);

          const itemDom = document.getElementById(`wt-item-${domKey}`);
          if (itemDom) {
            itemDom.style.opacity = '0';
            itemDom.style.transform = 'translateX(20px)';
            setTimeout(() => {
              itemDom.remove();
              updateMetrics();
              populateDiffSelectors();
            }, 250);
          } else {
            renderFilteredLists();
          }
        } else {
          alert('Worktree 尚未被完全移除，请重试或强制清理。');
          if (btn) {
            btn.disabled = false;
            btn.textContent = '移除';
          }
        }
      } catch (err) {
        alert('移除失败: ' + err.message);
        if (btn) {
          btn.disabled = false;
          btn.textContent = '移除';
        }
      }
    }

    /* 优化 2：精细化单个分支删除判断与单项 DOM 剔除 */
    async function delBranch(branchName, force) {
      const mode = force ? '强制删除 (分支未完全合入)' : '安全删除';
      if (!confirm(`确认${mode}本地分支 [${branchName}]?`)) return;

      const domKey = encodeURIComponent(branchName).replace(/%/g, '_');
      const btn = document.getElementById(`btn-del-br-${domKey}`);
      if (btn) {
        btn.disabled = true;
        btn.textContent = '删除中...';
      }

      try {
        const res = await fetch('/api/delete-branch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repoPath: currentRepo, branchName, force })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        const checkRes = await fetch(`/api/check-branch?path=${encodeURIComponent(currentRepo)}&branch=${encodeURIComponent(branchName)}`);
        const checkData = await checkRes.json();

        if (!checkData.exists) {
          currentBranches = currentBranches.filter(b => b.name !== branchName);

          const itemDom = document.getElementById(`br-item-${domKey}`);
          if (itemDom) {
            itemDom.style.opacity = '0';
            itemDom.style.transform = 'translateX(20px)';
            setTimeout(() => {
              itemDom.remove();
              updateMetrics();
            }, 250);
          } else {
            renderFilteredLists();
          }
        } else {
          alert('分支未能成功删除，请确认是否有未提交冲突。');
          if (btn) {
            btn.disabled = false;
            btn.textContent = '删除';
          }
        }
      } catch (err) {
        alert('删除失败: ' + err.message);
        if (btn) {
          btn.disabled = false;
          btn.textContent = '删除';
        }
      }
    }

    /* 优化 3：Diff 选择器更新与操作 */
    function populateDiffSelectors() {
      const baseSel = document.getElementById('diffBaseSelect');
      const targetSel = document.getElementById('diffTargetSelect');
      if (!baseSel || !targetSel) return;

      const curBase = baseSel.value;
      const curTarget = targetSel.value;

      baseSel.innerHTML = '';
      targetSel.innerHTML = '';

      if (currentWorktrees.length === 0) {
        baseSel.innerHTML = '<option value="">无可用 Worktree</option>';
        targetSel.innerHTML = '<option value="">无可用 Worktree</option>';
        return;
      }

      currentWorktrees.forEach((w) => {
        const label = `${w.isMain ? '⭐ [Main] ' : '🌳 '}${w.branch || 'HEAD'} (${w.path.split('/').pop()})`;
        const optA = document.createElement('option');
        optA.value = w.path;
        optA.textContent = label;
        baseSel.appendChild(optA);

        const optB = document.createElement('option');
        optB.value = w.path;
        optB.textContent = label;
        targetSel.appendChild(optB);
      });

      if (curBase && currentWorktrees.some(w => w.path === curBase)) {
        baseSel.value = curBase;
      } else {
        baseSel.value = currentWorktrees[0].path;
      }

      if (curTarget && currentWorktrees.some(w => w.path === curTarget)) {
        targetSel.value = curTarget;
      } else if (currentWorktrees.length > 1) {
        targetSel.value = currentWorktrees[1].path;
      } else {
        targetSel.value = currentWorktrees[0].path;
      }
    }

    function swapDiffTargets() {
      const baseSel = document.getElementById('diffBaseSelect');
      const targetSel = document.getElementById('diffTargetSelect');
      const temp = baseSel.value;
      baseSel.value = targetSel.value;
      targetSel.value = temp;
      fetchAndRenderDiff();
    }

    function viewDiffAgainstMain(targetWorktreePath) {
      switchTab('diff');
      const baseSel = document.getElementById('diffBaseSelect');
      const targetSel = document.getElementById('diffTargetSelect');
      if (currentWorktrees.length > 0) {
        baseSel.value = currentWorktrees[0].path;
        targetSel.value = targetWorktreePath;
        fetchAndRenderDiff();
      }
    }

    /* 查看指定 Worktree 未提交修改 (Dirty Diff) */
    async function viewUncommittedDiff(worktreePath) {
      switchTab('diff');
      const container = document.getElementById('diffResultsContainer');
      container.innerHTML = '<div class="loading">正在加载工作区未提交代码修改...</div>';

      try {
        const res = await fetch(`/api/uncommitted-diff?worktree=${encodeURIComponent(worktreePath)}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        renderUncommittedDiffView(data.uncommitted);
      } catch (err) {
        container.innerHTML = `<div class="empty-diff-box" style="color: var(--danger);">加载失败: ${err.message}</div>`;
      }
    }

    async function fetchAndRenderDiff() {
      const base = document.getElementById('diffBaseSelect').value;
      const target = document.getElementById('diffTargetSelect').value;
      const container = document.getElementById('diffResultsContainer');

      if (!base || !target) {
        alert('请选择两个工作区进行对比');
        return;
      }

      if (base === target) {
        container.innerHTML = `
          <div class="empty-diff-box">
            <div style="font-size: 16px; margin-bottom: 8px;">所选 Base 与 Target 为同一个工作区</div>
            <div style="font-size: 13px;">请在下拉菜单中选择两个不同的 Worktree</div>
          </div>
        `;
        return;
      }

      container.innerHTML = '<div class="loading">正在比对工作区 Diff 详情...</div>';

      try {
        const url = `/api/diff-worktrees?path=${encodeURIComponent(currentRepo)}&source=${encodeURIComponent(base)}&target=${encodeURIComponent(target)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        renderDiffView(data.diff);
      } catch (err) {
        container.innerHTML = `<div class="empty-diff-box" style="color: var(--danger);">Diff 计算失败: ${err.message}</div>`;
      }
    }

    function escapeHtml(str) {
      return (str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* 格式化代码块 */
    function formatDiffLines(rawDiff) {
      if (!rawDiff) return '<div style="padding: 16px; color: var(--text-muted);">无代码差异或二进制文件变更</div>';
      const lines = rawDiff.split('\n');
      return lines.map(line => {
        const escaped = escapeHtml(line);
        if (line.startsWith('+++') || line.startsWith('---') || line.startsWith('diff --git')) {
          return `<span class="diff-line line-file">${escaped}</span>`;
        } else if (line.startsWith('@@')) {
          return `<span class="diff-line line-hunk">${escaped}</span>`;
        } else if (line.startsWith('+')) {
          return `<span class="diff-line line-add">${escaped}</span>`;
        } else if (line.startsWith('-')) {
          return `<span class="diff-line line-del">${escaped}</span>`;
        } else {
          return `<span class="diff-line">${escaped || '&nbsp;'}</span>`;
        }
      }).join('');
    }

    /* 手风琴开关单个文件 Diff */
    function toggleFileDiff(cardId) {
      const card = document.getElementById(cardId);
      if (card) {
        card.classList.toggle('expanded');
      }
    }

    /* 全部展开 / 全部收起控制 */
    function toggleAllDiffs(expand) {
      const cards = document.querySelectorAll('.file-diff-card');
      cards.forEach(card => {
        if (expand) {
          card.classList.add('expanded');
        } else {
          card.classList.remove('expanded');
        }
      });
    }

    /* 渲染两个 Worktree 之间的 Diff 视图 */
    function renderDiffView(diff) {
      const container = document.getElementById('diffResultsContainer');
      const files = diff.files || [];
      const ahead = diff.ahead || 0;
      const behind = diff.behind || 0;

      let syncStatusBadge = '';
      if (ahead === 0 && behind === 0) {
        syncStatusBadge = '<span class="badge badge-success">两分支提交完全同步</span>';
      } else {
        const parts = [];
        if (ahead > 0) parts.push(`<span class="badge badge-success">领先 ${ahead} 个提交</span>`);
        if (behind > 0) parts.push(`<span class="badge badge-warning">落后 ${behind} 个提交</span>`);
        syncStatusBadge = parts.join(' ');
      }

      if (files.length === 0) {
        let emptyDesc = '🎉 两个 Worktree 提交点完全一致，无任何文件差异。';
        if (behind > 0 && ahead === 0) {
          emptyDesc = `ℹ️ <b>对比分支当前落后于基准分支（落后 ${behind} 个提交）</b>，且没有领先的独有代码修改。<br><span style="color: var(--text-muted); font-size: 13px;">已过滤反向差异，避免将基准分支的更新误显示为被删除。若需查看基准分支引入的新代码，可点击上方<b>【⇄ 对调】</b>。</span>`;
        }

        container.innerHTML = `
          <div class="diff-summary-card">
            <div class="stat-bar">
              <div>基准 (Base): <span class="badge">${escapeHtml(diff.source.branch)}</span> <code>${diff.source.path}</code></div>
              <div>对比 (Target): <span class="badge">${escapeHtml(diff.target.branch)}</span> <code>${diff.target.path}</code></div>
              <div style="margin-left: auto;">${syncStatusBadge}</div>
            </div>
            <div class="empty-diff-box" style="padding: 28px; border: none; background: transparent; line-height: 1.8;">
              ${emptyDesc}
            </div>
          </div>
        `;
        return;
      }

      let totalAdd = 0;
      let totalDel = 0;
      files.forEach(f => {
        totalAdd += f.added || 0;
        totalDel += f.deleted || 0;
      });

      const fileCardsHtml = files.map((f, idx) => {
        const cardId = `diff-card-${idx}`;
        const formattedCode = formatDiffLines(f.diffChunk);
        let statusTag = '<span class="file-status-badge status-modified">MODIFIED</span>';
        if (f.deleted === 0 && f.added > 0) statusTag = '<span class="file-status-badge status-added">ADDED</span>';
        if (f.added === 0 && f.deleted > 0) statusTag = '<span class="file-status-badge status-deleted">DELETED</span>';

        return `
          <div id="${cardId}" class="file-diff-card">
            <div class="file-header" onclick="toggleFileDiff('${cardId}')">
              <div class="file-title-left">
                <span class="file-arrow">▶</span>
                ${statusTag}
                <span>${escapeHtml(f.filePath)}</span>
              </div>
              <div style="display: flex; gap: 12px; align-items: center; font-size: 12px;">
                <span><span class="add-count">+${f.added}</span> <span class="del-count">-${f.deleted}</span></span>
              </div>
            </div>
            <div class="file-body">
              <pre class="diff-pre"><code>${formattedCode}</code></pre>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="diff-summary-card">
          <div class="stat-bar">
            <div>基准 (Base): <span class="badge">${escapeHtml(diff.source.branch)}</span> <code>${escapeHtml(diff.source.head ? diff.source.head.slice(0, 8) : '-')}</code></div>
            <div>对比 (Target): <span class="badge">${escapeHtml(diff.target.branch)}</span> <code>${escapeHtml(diff.target.head ? diff.target.head.slice(0, 8) : '-')}</code></div>
            <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
              ${syncStatusBadge}
              <span style="color: var(--text-muted);">|</span>
              <span>变更文件: <b>${files.length}</b> 个</span>
              <span>新增: <span class="add-count">+${totalAdd}</span></span>
              <span>删除: <span class="del-count">-${totalDel}</span></span>
            </div>
          </div>

          <div style="margin-top: 10px; font-size: 12px; color: var(--text-muted); background: rgba(88, 166, 255, 0.08); padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(88, 166, 255, 0.2);">
            💡 <b>仅对比分支领先改动 (三点比较 <code>base...target</code>)</b>：只展示对比分支自身引入的代码修改。
          </div>
        </div>

        <div class="diff-tools-bar">
          <div class="diff-tools-left">
            <span>📁 变更文件列表 (${files.length})</span>
            <span style="font-size: 12px; color: var(--text-muted); font-weight: normal;">单击单个文件展开/收起详情</span>
          </div>
          <div class="diff-tools-right">
            <button class="btn-outline" onclick="toggleAllDiffs(true)" style="font-size: 12px; padding: 4px 10px;">展开全部</button>
            <button class="btn-outline" onclick="toggleAllDiffs(false)" style="font-size: 12px; padding: 4px 10px;">收起全部</button>
          </div>
        </div>

        <div style="margin-top: 8px;">
          ${fileCardsHtml}
        </div>
      `;
    }

    /* 渲染未提交代码 (Dirty Diff) 视图 */
    function renderUncommittedDiffView(uncommitted) {
      const container = document.getElementById('diffResultsContainer');
      const files = uncommitted.files || [];

      if (files.length === 0) {
        container.innerHTML = `
          <div class="diff-summary-card">
            <div class="stat-bar">
              <div>工作区: <code>${escapeHtml(uncommitted.worktreePath)}</code></div>
              <div style="margin-left: auto;"><span class="badge badge-success">工作树干净 (Clean)</span></div>
            </div>
            <div class="empty-diff-box" style="padding: 28px; border: none; background: transparent;">
              🎉 该工作区没有任何未暂存或未提交的修改。
            </div>
          </div>
        `;
        return;
      }

      const fileCardsHtml = files.map((f, idx) => {
        const cardId = `uncommitted-card-${idx}`;
        const formattedCode = formatDiffLines(f.diffChunk);
        let statusTag = '<span class="file-status-badge status-modified">MODIFIED</span>';
        if (f.status === '?') statusTag = '<span class="file-status-badge status-added">UNTRACKED</span>';
        else if (f.deleted === 0 && f.added > 0) statusTag = '<span class="file-status-badge status-added">ADDED</span>';
        else if (f.added === 0 && f.deleted > 0) statusTag = '<span class="file-status-badge status-deleted">DELETED</span>';

        return `
          <div id="${cardId}" class="file-diff-card">
            <div class="file-header" onclick="toggleFileDiff('${cardId}')">
              <div class="file-title-left">
                <span class="file-arrow">▶</span>
                ${statusTag}
                <span>${escapeHtml(f.filePath)}</span>
              </div>
              <div style="display: flex; gap: 12px; align-items: center; font-size: 12px;">
                <span><span class="add-count">+${f.added}</span> <span class="del-count">-${f.deleted}</span></span>
              </div>
            </div>
            <div class="file-body">
              <pre class="diff-pre"><code>${formattedCode}</code></pre>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="diff-summary-card">
          <div class="stat-bar">
            <div>本地工作区: <code>${escapeHtml(uncommitted.worktreePath)}</code></div>
            <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
              <span class="badge badge-warning">未提交代码 (${files.length} 个文件)</span>
              <span style="color: var(--text-muted);">|</span>
              <span>新增: <span class="add-count">+${uncommitted.totalAdded}</span> 行</span>
              <span>删除: <span class="del-count">-${uncommitted.totalDeleted}</span> 行</span>
            </div>
          </div>
        </div>

        <div class="diff-tools-bar">
          <div class="diff-tools-left">
            <span>📝 未提交代码文件清单 (${files.length})</span>
            <span style="font-size: 12px; color: var(--text-muted); font-weight: normal;">单击单项展开/收起代码审查</span>
          </div>
          <div class="diff-tools-right">
            <button class="btn-outline" onclick="toggleAllDiffs(true)" style="font-size: 12px; padding: 4px 10px;">展开全部</button>
            <button class="btn-outline" onclick="toggleAllDiffs(false)" style="font-size: 12px; padding: 4px 10px;">收起全部</button>
          </div>
        </div>

        <div style="margin-top: 8px;">
          ${fileCardsHtml}
        </div>
      `;
    }

    function copyText(text, btn) {
      if (!navigator.clipboard) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } else {
        navigator.clipboard.writeText(text);
      }
      if (btn) {
        const orig = btn.textContent;
        btn.textContent = '已复制!';
        btn.style.color = 'var(--success)';
        setTimeout(() => {
          btn.textContent = orig;
          btn.style.color = '';
        }, 1500);
      }
    }

    /* 页面事件监听 */
    document.getElementById('repoFilterInput').addEventListener('input', (e) => {
      repoFilterKeyword = e.target.value;
      renderRepoDropdownList();
    });
    document.getElementById('refreshBtn').addEventListener('click', () => {
      inspectRepo(currentRepo);
    });
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchKeyword = e.target.value;
      renderFilteredLists();
    });
    document.getElementById('pruneBtn').addEventListener('click', async () => {
      const res = await fetch('/api/prune-worktrees', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ repoPath: currentRepo })
      });
      const data = await res.json();
      if (data.ok) {
        alert('Worktrees prune 执行成功！');
        inspectRepo(currentRepo);
      } else {
        alert('Prune 失败: ' + data.error);
      }
    });

    loadProjects();
  </script>
</body>
</html>
