# Git Lens Web 桌面版打包配置（GitHub Release 正式构建）。
#
# 产物策略（计划书 §8）：
#  - macOS 目标 dmg + zip，arm64/x64 双架构；zip 用于应用内更新；
#  - 发行包内不包含测试 fixture、自验脚本与文档：files 只放行业务源码，
#    electron/checks/（冒烟自验）、test/、scripts/、docs/、assets/ 等均未列入，自然不进包；
#  - 生产依赖（express、cors 及其传递依赖）由 electron-builder 依据 package.json
#    与 package-lock.json 自动收集进包，不在 files 中重复声明；
#  - asar 保持默认开启：主进程/service 子进程的 ESM import、preload.cjs、public 静态资源
#    读取在 asar 内均由 Electron 支持（G2 已验证机制，打包态验证记录见
#    docs/proposals/electron-release.md）。
#
# 正式 CI 构建不固定 identity：electron-builder 会从 CSC_LINK 导入的钥匙串中自动选择
# Developer ID Application 证书。APPLE_API_KEY_* 或 APPLE_ID_* 凭据存在时，
# electron-builder 会在签名后调用 notarytool 公证。
# 本机无证书时请使用 electron-builder.local.yml，它显式采用 ad-hoc 签名，仅用于本机验收。
appId: com.sharpxia.git-lens-web
productName: Git Lens
# 产物输出目录（release/ 已在 .gitignore 中忽略，构建产物不入库）
directories:
  output: release
  # 图标等构建资源目录，正式 App icon 放在这里供 electron-builder 生成 macOS 应用图标。
  buildResources: assets
# package.json 未声明 main 字段（仓库保持 CLI 直接运行 src/server.js 的形态，不为其改动根文件）；
# 桌面打包入口经 extraMetadata 注入打包内 package.json，仓库根 package.json 不受影响
extraMetadata:
  main: electron/main.js
  gitLensUpdatesEnabled: true
publish:
  provider: github
  owner: SharpXia
  repo: git-lens-web
extraResources:
  - from: electron/app-update.yml
    to: app-update.yml
files:
  - package.json
  - electron/main.js
  - electron/service-main.js
  # main.js 的相对 import：缺一会直接 ERR_MODULE_NOT_FOUND 导致 App 闪退。
  # 历史教训：a5e18e8（G7 交付）/ dc1e3bd（窗口融合）/ 29c4fd3（应用名迁移）
  # 各自新增一个文件，但 files 白名单只补了部分，导致打包态启动崩溃。
  - electron/service-config-dir.js
  - electron/window-chrome.js
  - electron/user-data-migration.js
  - electron/update-manager.js
  - electron/preload.cjs
  - electron/tabbar.html
  - electron/tabbar-preload.cjs
  - src/**
  - public/**
  # dev-brand.mjs 是开发模式品牌补丁脚本（修 dev 模式下 Electron.app 的 Info.plist），
  # 打包态自带正确 Info.plist，无需此补丁；同时也排除 checks/ 冒烟自验脚本与 fixtures。
  - "!**/.DS_Store"
  - "!**/dev-brand.mjs"
  - "!**/checks/**"
# 产物命名去掉 productName 中的空格，便于脚本化分发与校验
artifactName: ${name}-${version}-mac-${arch}.${ext}
mac:
  icon: assets/icon.icns
  # 开发者工具类目：面向开发者的本地 Git 仓库透镜，归类 developer-tools；
  # 备选 public.app-category.utilities 语义更泛，与工具定位不符
  category: public.app-category.developer-tools
  # 正式分发必须启用 hardened runtime；本机 ad-hoc 验收由 local 配置覆盖为 false。
  hardenedRuntime: true
  # CI 已通过凭据门禁；证书导入或 identity 选择失败时必须中止构建，不能退化成未签名产物。
  forceCodeSigning: true
  # 有完整 Apple 公证凭据时自动调用 notarytool；缺少凭据时仅跳过公证并输出告警。
  notarize: true
  # 每个 CI job 通过命令行只选择一个架构；这里不能固定双架构列表，否则两个 job
  # 会重复生成同名产物，发布阶段合并 artifact 时容易把文件互相覆盖。
  target:
    - target: dmg
    - target: zip
